name: Publish Docker image

# Builds the web app image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest   (default branch)
#   ghcr.io/<owner>/<repo>:vX.Y.Z   (tags)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build identity shown in the web UI header and at /api/version (same stamp as scripts/build-image.sh).
      - id: stamp
        run: |
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=PoB-Enhanced
            org.opencontainers.image.description=Path of Building 2 (Path of Exile 2) as a web app with build advisors, REST API and MCP server
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/enhanced.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            GIT_COMMIT=${{ steps.stamp.outputs.commit }}
            BUILD_TIME=${{ steps.stamp.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
